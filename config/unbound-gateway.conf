# /etc/unbound/unbound.conf.d/gateway.conf
# DNS forwarder for the clients on NIC B. All queries go to ProtonVPN's resolver
# through the tunnel, so nothing is resolved by the ISP.

server:
    interface: 127.0.0.1
    interface: 10.10.10.1
    # NIC B may come up after unbound
    ip-freebind: yes
    access-control: 127.0.0.0/8 allow
    access-control: 10.10.10.0/24 allow
    do-ip6: no
    hide-identity: yes
    hide-version: yes
    prefetch: yes

forward-zone:
    name: "."
    forward-addr: 10.2.0.1
